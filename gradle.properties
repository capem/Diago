# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Right-sized memory and G1GC with SoftRefLRUPolicy to prevent swap thrashing and OOMs.
org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+TieredCompilation -Dfile.encoding=UTF-8

# Gradle build performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
org.gradle.workers.max=4
org.gradle.tooling.parallel=true

# Kotlin build performance settings
kotlin.code.style=official
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Android build optimizations
android.nonTransitiveRClass=true
